# Publishing a GitHub release uploads that version to PyPI.
# No token is stored: PyPI trusts this workflow ("trusted publishing"), which is
# set up once on pypi.org — see the README, "Releasing".
name: publish
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
