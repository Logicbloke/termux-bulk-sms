[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-bulk-sms"
dynamic = ["version"]
description = "Bulk SMS from your own Android phone through Termux:API, driven from a web page on your local network"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Taha Zouhair" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["termux", "sms", "android", "bulk-sms", "termux-api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Android",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Telephony",
]

[project.urls]
Homepage = "https://github.com/Logicbloke/termux-bulk-sms"
Issues = "https://github.com/Logicbloke/termux-bulk-sms/issues"

[project.scripts]
termux-bulk-sms = "termux_bulk_sms.cli:main"

[tool.setuptools]
packages = ["termux_bulk_sms"]

[tool.setuptools.package-data]
termux_bulk_sms = ["static/*"]

[tool.setuptools.dynamic]
version = { attr = "termux_bulk_sms.__version__" }
